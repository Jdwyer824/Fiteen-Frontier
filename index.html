<script>/* Firebase adapter: gives the game the same small data API it uses inside Claude. */
function firebaseDb(){
 const cfg=window.FIREBASE_CONFIG;
 if(!cfg||!cfg.projectId||typeof firebase==='undefined') return null;
 try{
  if(!firebase.apps.length) firebase.initializeApp(cfg);
  const fs=firebase.firestore();
  const err=e=>({code:e&&e.code==='permission-denied'?'invalid_argument':e&&e.code==='resource-exhausted'?'quota_exceeded':'unavailable',message:String(e&&e.message||e)});
  const wrap=s=>({id:s.id,exists:s.exists,data:()=>s.data(),metadata:s.metadata});
  // Firestore replaces nested maps on update; the roster must merge one player at a time.
  const flat=d=>{ const o={}; for(const [k,v] of Object.entries(d)){ if(k==='roster'&&v&&typeof v==='object'&&!Array.isArray(v)){ for(const [id,e] of Object.entries(v)) o['roster.'+id]=e; } else o[k]=v; } return o; };
  const doc=p=>{ const r=fs.doc(p); return {
   get:async()=>{ try{ return wrap(await r.get()); }catch(e){ throw err(e); } },
   set:d=>r.set(d).catch(e=>{ throw err(e); }),
   update:d=>r.update(flat(d)).catch(e=>{ throw err(e); }),
   onSnapshot:(next,onErr)=>r.onSnapshot(s=>next(wrap(s)),e=>onErr&&onErr(err(e))) }; };
  const collection=p=>{ let q=fs.collection(p); const api={
   limit(n){ q=q.limit(n); return api; },
   onSnapshot:(next,onErr)=>q.onSnapshot(qs=>next({docs:qs.docs.map(wrap),size:qs.size,empty:qs.empty}),e=>onErr&&onErr(err(e))) }; return api; };
  return {doc,collection};
 }catch(e){ return null; }
}
</script>

<script>// Fiteen Frontier v3 — money in $M, fuel in thousand barrels (k bbl). Revenue $M = k bbl × $/bbl ÷ 1000.
const P = {
  start: 12, overhead: 1, wholesale: 60,
  sites: {
    desert: { name: 'Desert Rim', tagline: 'Small and safe', license: 2, advertised: 150, actual: 150, cost: 30, risky: false },

    coast: { name: 'Coastal Shelf', tagline: 'Cheapest to pump, seller promises a lot', license: 4, advertised: 250, actual: 100, cost: 25, risky: false },
  },

    loan: { name: 'Bank loan', cash: 6, repay: 8, share: 0 },

  },
  rigs: { starter: { name: 'Starter rigs', output: 0.5, per100: 1.5 }, full: { name: 'Full rigs', output: 1, per100: 3 } },
  transport: { truck: { name: 'Trucks', perBbl: 5, cost: 0 }, pipeline: { name: 'Pipeline', perBbl: 1, cost: 3 } },
  safetyCost: 1, accidentChance: 0.35, accidentCost: 4, accidentCut: 0.3,
  protectCost: 1, fineChance: 0.5, fineChancePledge: 0.2, fineCost: 4,
  surveyCost: 0.5, interviewCost: 0.3, pledgeCost: 0.5, marketingCost: 1, marketingBoost: 0.1,
  rndCost: 1.5, rndCut: 4, extendCost: 3, extendBoost: 0.15, insuranceCost: 0.5, insuranceCover: 0.75,
  pushOutput: 0.2, pushCost: 3, pushRisk: 0.1, researchCost: 0.5,
  reassureCost: 0.5, repayEarly: 7, buybackCost: 3.5, buybackShare: 0.1, bonusCost: 1, bonusBoost: 0.1,
  efficiencyCost: 1, efficiencyCut: 5, loyaltyCost: 1, loyaltyBoost: 0.15,
  customers: {
    utilities: { name: 'Power utilities', bonus: 0, certCost: 0, cap: Infinity, buys: { low: 1, mid: 0.8, high: 0.55 } },
    airlines: { name: 'Airlines', bonus: 15, certCost: 1, cap: 150, buys: { low: 1, mid: 0.95, high: 0.85 } },
  },
  tiers: { low: { name: 'Low', price: 75 }, mid: { name: 'Market', price: 90 }, high: { name: 'Premium', price: 105 } },
  crises: {
    leak: { title: 'Tank leak near a town', text: 'A storage tank leaked fuel into a creek next to a small town. Nobody outside the company knows yet.',
      options: { a: 'Full cleanup and public apology: $3M', b: 'Quick patch, stay quiet: $1M, but a 50% chance the town sues for $5M (25% with the community pledge)', c: 'Do nothing: free, but a 70% chance it hits the news (40% with the pledge): $6M fine and your customer buys 25% less next round' } },
    strike: { title: 'Workers walk out', text: 'Field workers stopped work over pay and long shifts.',
      options: { a: 'Raise pay: $2M now and $1M more next round', b: 'Negotiate: $1M, output down 20% this round', c: 'Hire replacements: $0.5M, output down 40% this round and a 30% accident chance (15% with the pledge)' } },
    spike: { title: 'Cold snap', text: 'A cold snap hit. Traders are offering $95 a barrel for everything you can pump this round.',
      options: { a: 'Sell everything to traders at $95. Your customer buys 30% less next round', b: 'Stay loyal to your customer. They pay you $5 more per barrel next round', c: 'Split it: half to traders at $95, half to your customer as usual' } },
  },
  competitorCut: 15,
  cards: {
    war: { name: 'Price war', desc: 'Cut your price another $10. Your customer buys everything.', cost: 0 },
    contract: { name: 'Long-term contract', desc: 'Lock in $85 a barrel for all your fuel.', cost: 0 },
    brand: { name: 'Brand campaign', desc: 'Keep your price. Customer buys 20% more.', cost: 2 },
    expand: { name: 'Expand the field', desc: 'Pump 50% more this round.', cost: 4 },
    sell: { name: 'Sell the company', desc: 'A buyer offers $8M today. You skip this round.', cost: 0 },
  },
  buyout: 8, buyoutPush: 10, predictBand: 1, predictBonus: 0.5, cleanBonus: 3,
};
const yes = v => v === true || v === 'yes';
const YN = (yesLabel, yesMeta, yesDesc, noLabel, noDesc) => [{ v: 'no', label: noLabel || 'No', meta: 'Free', desc: noDesc || '' }, { v: 'yes', label: yesLabel, meta: yesMeta, desc: yesDesc }];

// Role-owned decisions per round. `show(st)` hides a decision when it doesn't apply.
const DECISIONS = {
  1: [
    { key: 'site', owner: 'Explorer', title: 'Which site do we license?', opts: Object.entries(P.sites).map(([k, v]) => ({ v: k, label: v.name, meta: `License $${v.license}M · ${v.advertised}k bbl a round · $${v.cost}/bbl to pump`, desc: v.tagline + (v.risky ? '. 50% chance of a $4M wetland fine each round unless the CEO pays $1M for protection.' : '.') })), def: 'desert' },
    { key: 'survey', owner: 'Operations', info: true, title: 'Survey the sites first?', opts: YN('Survey', '$0.5M', 'Engineers check what is really underground at all three sites.', 'Skip it'), def: 'no' },
    { key: 'interviews', owner: 'Sales', info: true, title: 'Interview potential customers?', opts: YN('Interview', '$0.3M', 'Learn exactly how much each customer buys at each price. Saves buying research in Round 4.', 'Skip it'), def: 'no' },
    { key: 'pledge', owner: 'CEO', title: 'Make a community pledge?', opts: YN('Pledge', '$0.5M once', 'Commit to working with local communities. Cuts wetland fine risk from 50% to 20% and lowers the odds of bad crisis outcomes.', 'No pledge'), def: 'no' },

  enqueue(async()=>{ try{ await dbRef.update({draft}); }catch(e){ writeFailed(e); } finally{ if(!saveTimer) dirtyLocal=false; } });
 }, now?0:500);
}
async function joinGame(name){
 const team=name.trim().slice(0,60)||'Team';
 try{ localStorage.setItem('novium-team',team); }catch(e){}
 stopBoard();
 await getMyId(); try{ me.name=localStorage.getItem('novium-name')||''; }catch(e){}
 if(!live){ game={team,decisions:[],draft:{},roster:{}}; mode='roles'; rebuild(); render(); return; }
 dbRef=db.doc('games3/'+slug(team));
 let snap=null; try{ snap=await dbRef.get(); }catch(e){}
 if(snap&&snap.exists){ const v=snap.data(); game={team:String(v.team||team).slice(0,60),decisions:Array.isArray(v.decisions)?v.decisions:[],draft:(v.draft&&typeof v.draft==='object')?v.draft:{},roster:cleanRoster(v.roster)}; }
 else { game={team,decisions:[],draft:{},roster:{}}; if(canWrite){ try{ await enqueue(()=>dbRef.set({team,decisions:[],draft:null,roster:{},updatedAt:Date.now()})); }catch(e){ if(e&&e.code==='invalid_argument') canWrite=false; } } }
 const mine=game.roster[myId]; if(mine){ me={name:mine.name,roles:[...mine.roles]}; }
 mode=canWrite&&!mine?'roles':'game'; rebuild(); render();
 unsubGame=dbRef.onSnapshot(snap=>{
  if(!snap.exists) return;
  const v=snap.data()||{}, decs=Array.isArray(v.decisions)?v.decisions:[], draft=(v.draft&&typeof v.draft==='object')?v.draft:{};
  const roster=cleanRoster(v.roster), rosterChanged=JSON.stringify(roster)!==JSON.stringify(game.roster||{});
  const structural=decs.length!==game.decisions.length||!!draft.research!==!!(game.draft||{}).research||(draft.crisisCard||'')!==((game.draft||{}).crisisCard||'');
  game.roster=roster;
  if(rosterChanged){ if(mode==='roles') renderRoleCards(); else if(mode==='game'){ const act=document.activeElement&&document.activeElement.id; render(); if(act&&$('#'+act)) $('#'+act).focus(); } }
  if(!structural&&(snap.metadata.hasPendingWrites||dirtyLocal)) return;
  game={team:game.team,decisions:decs,draft,roster};
  if(structural){ rebuild(); if(mode==='game') render(); } else if(mode==='game'){ applyDraft(draft); check(); }
 },()=>{ live=false; render(); });
}
function leaveGame(){
 if(unsubGame){unsubGame();unsubGame=null;}
 clearTimeout(saveTimer); saveTimer=null; dirtyLocal=false;
 dbRef=null; game=null; st=null; mode='lobby'; confirmReset=false; render(); subscribeBoard();
}

/* ---------- draft <-> form ---------- */
function slotKeys(){ return st?[...roundSlots(st.round).map(d=>d.key),...recurringSlots().map(r=>r.key)]:[]; }
function readDraft(){
 const dr={research:!!st.researchBought};
 for(const k of slotKeys()){ const el=document.querySelector(`input[name="d_${k}"]:checked`); if(el) dr[k]=el.value; }
 const pr=$('#predict'); if(pr) dr.predict=pr.value;
 const why=$('#why'); if(why) dr.why=why.value;
 if($('#crisisCard')) dr.crisisCard=$('#crisisCard').value;
 return dr;
}
function applyDraft(dr){
 if(!dr) return; const act=document.activeElement;
 for(const k of slotKeys()){ if(typeof dr[k]!=='string') continue; const el=document.querySelector(`input[name="d_${k}"][value="${CSS.escape(dr[k])}"]`); if(el) el.checked=true; }
 const pr=$('#predict'); if(pr&&typeof dr.predict==='string'&&pr!==act) pr.value=dr.predict;
 const why=$('#why'); if(why&&typeof dr.why==='string'&&why!==act) why.value=dr.why.slice(0,600);
}
function readD(){
 const dr=readDraft(), d={};
 for(const s of [...roundSlots(st.round),...recurringSlots()]) d[s.key]=typeof dr[s.key]==='string'?dr[s.key]:s.def;
 for(const r of RECURRING) if(!(r.key in d)) d[r.key]='no';
 d.research=st.researchBought?'yes':'no';
 d.why=(dr.why||'').trim().slice(0,600); d.predict=null;
 if(dr.predict!==undefined&&dr.predict!==''&&!isNaN(parseFloat(dr.predict))) d.predict=parseFloat(dr.predict);
 if(dr.crisisCard) d.crisisCard=dr.crisisCard;
 d.by=me.name?`${me.name} (${leadOf(st.round)})`:'';
 return d;
}
function check(){
 if(!$('#run')) return;
 const d=readD(), R=st.round, up=p3Upfront(st,{...d,predict:undefined});
 let w='';
 if(up>0&&up>st.cash+1e-9) w=`This round’s purchases add up to ${m(up)}, but the team only has ${m(st.cash)}. Agree on what to drop.`;
 else if(R>=3&&d.predict===null) w='Finance needs to enter the predicted profit.';
 else if(d.why.length<10) w='Write a sentence on why the team chose this.';
 $('#warn').textContent=up>0&&up>st.cash+1e-9?w:'';
 const block=runBlock();
 $('#upfront').textContent=(block?block+' ':'')+(up>0?`Purchases this round: ${m(up)} of the team’s ${m(st.cash)}`:'');
 $('#run').disabled=!!w||!!block; $('#run').title=w||block;
}
/* ---------- results ---------- */
function optLabel(stAt,R,key,v){ const o=(decisionOptions(stAt,R,key)||[]).find(x=>x.v===v); return o?o.label:String(v); }
function summary(h){
 const c=h.choice||{}, R=h.round, before=replay(game.team,game.decisions.slice(0,R-1));
 if(R===5&&c.crisisCard&&P.crises[c.crisisCard]) before.crisis=c.crisisCard;
 const parts=(DECISIONS[R]||[]).filter(d=>!(R===6&&c.card!=='sell'&&d.key==='negotiate')&&!(R===6&&c.card==='sell'&&(d.key==='efficiency'||d.key==='loyalty'))).map(d=>`${d.owner}: ${optLabel(before,R,d.key,c[d.key])}`);
 if(R===5) parts[0]=`CEO: ${P.crises[before.crisis].title}, ${optLabel(before,R,'crisis',c.crisis)}`;
 if(R>=3&&!(R===6&&c.card==='sell')) parts.push(`safety ${yes(c.safety)?'on':'off'}${st.site==='ridge'?`, protection ${yes(c.protect)?'on':'off'}`:''}`);
 if(R===4&&yes(c.research)) parts.push('bought research');
 return parts.join(' · ');
}
function ledger(){
 const H=st.history, N=[0,1,2,3,4,5];
 const rows=[['Fuel pumped (k bbl)',h=>h.out,'n'],['Sales',h=>h.revenue],['Pumping & transport',h=>-h.pumping],['Running costs',h=>-h.operating],['Accidents & fines',h=>-h.penalties],['Profit',h=>h.profit,'key'],['Prediction bonus',h=>h.bonus],['Purchases',h=>-h.invest],['New funding',h=>h.financing],['Cash at end',h=>h.cash,'key']];
 return `<h3>Results · $M</h3><div class="tbl"><table><thead><tr><th></th>${N.map(i=>`<th>R${i+1}</th>`).join('')}</tr></thead><tbody>
 ${rows.map(([l,f,c])=>`<tr class="${c==='key'?'key':''}"><td>${l}</td>${N.map(i=>H[i]?(c==='n'?`<td>${Math.round(f(H[i]))}</td>`:cell(f(H[i]))):'<td></td>').join('')}</tr>`).join('')}
 </tbody></table></div><p class="note" style="margin-top:8px">Running costs = overhead, safety, protection, insurance and crisis costs. Purchases = everything bought up front: licenses, survey, interviews, pledge, pipeline, marketing, research partnership, rigs, extension, certification, crisis moves and Round 6 moves.</p>`;
}

/* ---------- role report (end of game) ---------- */
function whatIf(decs){ const r=replayChecked(game.team,decs); return {final:r.s.done?r.s.final:NaN,blocked:r.blocked}; }
function roleAlts(role,decs){
 const list=[];
 for(let R=1;R<=6;R++) for(const d of (DECISIONS[R]||[])){ if(d.owner!==role) continue; const stAt=replay(game.team,decs.slice(0,R-1)); if(R===5&&decs[4].crisisCard) stAt.crisis=decs[4].crisisCard;
  for(const o of decisionOptions(stAt,R,d.key)){ if(o.v===decs[R-1][d.key]) continue; if(d.info&&o.v==='no') continue; if(R===6&&d.key==='negotiate'&&decs[5].card!=='sell') continue;
   const alt=decs.map(x=>({...x})); alt[R-1][d.key]=o.v; if(d.key==='site'&&o.v==='ridge') alt.forEach((x,i)=>{ if(i>=2) x.protect='yes'; });
   const r=whatIf(alt); if(!isNaN(r.final)&&!r.blocked) list.push({label:`${d.title.replace(/\?$/,'')} → ${o.label} (Round ${R})`,final:r.final}); } }
 for(const rc of RECURRING){ if(rc.owner!==role) continue; if(rc.key==='protect'&&st.site!=='ridge') continue;
  for(const v of ['yes','no']){ const alt=decs.map((x,i)=>i>=2?{...x,[rc.key]:v}:{...x}); const r=whatIf(alt); if(!isNaN(r.final)&&!r.blocked) list.push({label:`${rc.title} ${v==='yes'?'on':'off'} every round`,final:r.final}); } }
 return list;
}
function roleReport(){
 const decs=game.decisions.slice(0,6), H=st.history, site=P.sites[st.site];
 const base=whatIf(decs).final, roster=game.roster||{};
 const who=role=>{ const names=holders(role,roster).map(([k,v])=>v.name); return names.length?names.join(' & '):'Unassigned'; };
 const diff=x=>(x>=0?'+':'−')+'$'+Math.abs(x).toFixed(1)+'M';
 const judge=b=>(!b||b.final-base<0.5)?['top','Best call']:(b.final-base<4)?['mid','Close']:['low','Room to grow'];
 const chose=role=>{ const items=[]; for(let R=1;R<=6;R++){ const stAt=replay(game.team,decs.slice(0,R-1)); if(R===5&&decs[4]&&decs[4].crisisCard) stAt.crisis=decs[4].crisisCard; for(const d of (DECISIONS[R]||[])) if(d.owner===role&&decs[R-1]&&!(R===6&&d.key==='negotiate'&&decs[5].card!=='sell')&&!(R===6&&decs[5].card==='sell'&&(d.key==='efficiency'||d.key==='loyalty'))) items.push(`R${R} ${optLabel(stAt,R,d.key,decs[R-1][d.key])}`); } return items.join(' · '); };
 const totalOut=H.reduce((a,h)=>a+h.out,0), log=H.flatMap(h=>h.log);
 const nAcc=log.filter(l=>/^ACCIDENT/.test(l)).length, nFine=log.filter(l=>/^WETLAND FINE/.test(l)).length;
 const specs={
  Explorer:{help:`Set the team’s earning power: ${site.name} produced ${Math.round(totalOut)}k barrels.`,good:[],other:[]},
  Finance:{help:decs[1].funding==='none'?'Kept the founders at 100% ownership.':`Brought in ${m(P.funding[decs[1].funding].cash)} to build with.`,good:[],other:[]},
  Operations:{help:`Pumped ${Math.round(totalOut)}k barrels with ${nAcc} accident${nAcc===1?'':'s'}${site.risky?` and ${nFine} wetland fine${nFine===1?'':'s'}`:''}.`,good:[],other:[]},
  Sales:{help:`Brought in ${m(H.slice(3).reduce((a,h)=>a+h.revenue,0))} in sales over Rounds 4–6.`,good:[],other:[]},
  CEO:{help:`Steered the team to ${m(st.final)} for the founders.`,good:[],other:[]},
 };
 if(st.site==='ridge') specs.Explorer.good.push('Picked the biggest site in the game.');
 if(st.site==='coast'&&!st.surveyed) specs.Explorer.other.push('Coastal Shelf held 100k barrels, not 250k. Nobody checked first.');
 if(st.rnd) specs.Explorer.good.push('The geology partnership cut pumping costs $4 a barrel.');
 if(st.extend) specs.Explorer.good.push('Extended the field for 15% more output.');
 const preds=H.filter(h=>typeof h.predict==='number');
 if(preds.length){ const err=preds.reduce((a,h)=>a+Math.abs(h.predict-h.profit),0)/preds.length; (st.predictHits>=3?specs.Finance.good:specs.Finance.other).push(`Predictions: ${st.predictHits} of 4 within $1M, off by ${m(err)} on average.`); }
 if(decs[1].funding==='investor') specs.Finance.other.push(`The investor’s share of the final company was worth ${m(Math.max(0,st.companyValue)*(1-st.ownership))}.`);
 if(st.loanRepaid) specs.Finance.good.push('Repaid the loan early and saved $1M.');
 if(st.surveyed) specs.Operations.good.push('Surveyed before the team spent on a license.');
 if(st.rigs==='full') specs.Operations.good.push('Ran the field at full capacity.'); else specs.Operations.other.push('Starter rigs kept the field at half capacity.');
 if(nAcc===0) specs.Operations.good.push('No field accidents.'); else specs.Operations.other.push(`${nAcc} field accident${nAcc===1?'':'s'} cost money and output.`);
 if(st.interviews||st.researched) specs.Sales.good.push('Priced with real data on what customers buy.'); else specs.Sales.other.push('Chose a price without knowing how much customers would buy.');
 if(st.marketing) specs.Sales.good.push('The pre-launch campaign lifted orders 10%.');
 const h5=H[4];
 if(h5&&h5.log.some(l=>/sued|made the news/.test(l))) specs.CEO.other.push('The crisis response led to a lawsuit or fine.');
 else specs.CEO.good.push(`Handled the ${P.crises[st.crisis].title.toLowerCase()} without lawsuits or crisis fines.`);
 if(st.pledge) specs.CEO.good.push('The community pledge lowered fine and crisis risks.');
 if(decs[5].card==='sell') specs.CEO.good.push('Sold the company before the competitor squeezed prices.');
 if(nFine) specs.CEO.other.push(`Skipping wetland protection led to ${nFine} fine${nFine===1?'':'s'}.`);
 const cards=ROLE_KEYS.map(role=>{ const list=roleAlts(role,decs).sort((a,b)=>b.final-a.final), best=list[0]; let v=judge(best);
  const skipped=role==='Operations'&&decs.slice(2).some(d=>d&&d.card!=='sell'&&!yes(d.safety))&&nAcc===0; if(skipped&&v[0]==='top') v=['mid','Risky'];
  if(skipped) specs.Operations.other.push('Skipped safety and got lucky.');
  const alt=best&&best.final-base>=0.5?`<b>Another way:</b> ${best.label} would have ended at ${m(best.final)} for the founders (${diff(best.final-base)}), with everything else the same.`:'<b>Best available calls.</b> No other choice this role made would have finished more than $0.5M higher.';
  return {role,who:who(role),chose:chose(role),help:specs[role].help,good:specs[role].good,other:specs[role].other,alt,v}; });
 return {base,cards};
}
function roleReportHtml(){
 let r; try{ r=roleReport(); }catch(e){ return ''; }
 return `<fieldset><legend>Role report</legend>
 <p class="note" style="margin:0">\u201cAnother way\u201d replays your exact game with one decision changed and the same luck, not counting prediction bonuses (baseline ${m(r.base)}).</p>
 <div class="rolereport">${r.cards.map(c=>`<div class="rr"><header><b>${c.role}</b><span class="verdict ${c.v[0]}">${c.v[1]}</span></header>
 <span class="who">${esc(c.who)}</span>
 <p class="note" style="margin:0"><b>Decided:</b> ${esc(c.chose)}</p>
 <p style="margin:0;font-size:.9rem"><b>Helped the team:</b> ${c.help}</p>
 ${c.good.length?`<ul class="fb good">${c.good.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
 ${c.other.length?`<ul class="fb bad">${c.other.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}
 <ul class="fb tip"><li>${c.alt}</li></ul></div>`).join('')}</div></fieldset>`;
}
function roleReportText(){
 let r; try{ r=roleReport(); }catch(e){ return ''; }
 const strip=s=>s.replace(/<[^>]+>/g,'');
 return '\n\nROLE REPORT\n'+r.cards.map(c=>`${c.role} (${c.who}) — ${c.v[1]}\n  Decided: ${c.chose}\n  Helped the team: ${strip(c.help)}\n${[...c.good.map(x=>'  + '+strip(x)),...c.other.map(x=>'  - '+strip(x))].join('\n')}\n  ${strip(c.alt)}`).join('\n');
}
function endView(){
 const f=P.funding[st.funding], gain=st.final-P.start;
 const text=`${st.team} — Fiteen Frontier\nFounders' final value: ${m(st.final)} (started with $12.0M)\nPredictions within $1M: ${st.predictHits} of 4\n\n`+st.history.map(h=>`Round ${h.round} (${ROUNDS[h.round-1][0]}): ${summary(h)}${h.choice&&h.choice.by?` — run by ${h.choice.by}`:''}\n  Why: ${h.why}${typeof h.predict==='number'?`\n  Predicted ${m(h.predict)}, actual ${m(h.profit)}`:''}`).join('\n')+roleReportText();
 return `<div><h3>Game over</h3><h2>${gain>20?'Big win.':gain>10?'Strong business.':gain>0?'You made some money.':'You lost money.'}</h2></div>
 <div class="exit">${[['Cash after Round 6',m(st.cash)],['Clean-record bonus',m(st.clean)],['Loan repayment',m(-f.repay)],['Company value',m(st.companyValue)],['Founders own',Math.round(st.ownership*100)+'%'],['Founders’ final value',m(st.final)],['Predictions within $1M',st.predictHits+' of 4']].map(([a,b])=>`<div class="kpi"><span>${a}</span><strong>${b}</strong></div>`).join('')}</div>
 ${st.clean?'':`<p class="note">No clean-record bonus: ${st.incidents} accident${st.incidents===1?'':'s'}, fine${st.incidents===1?'':'s'} or lawsuit${st.incidents===1?'':'s'}.</p>`}
 ${roleReportHtml()}
 <fieldset><legend>Your decision log</legend><div class="decisions">${st.history.map(h=>`<div><span class="r">Round ${h.round} · ${ROUNDS[h.round-1][0]}</span><br><b>${esc(summary(h))}</b>${h.choice&&h.choice.by?`<span class="note"> · run by ${esc(h.choice.by)}</span>`:''}<br>${esc(h.why)}${typeof h.predict==='number'?`<br><span class="note">Predicted ${m(h.predict)}, actual ${m(h.profit)}</span>`:''}</div>`).join('')}</div>
 <div class="row"><button class="alt" id="copy">Copy decision log</button><span class="note" id="cp">Paste it into your team write-up or send it to your instructor.</span></div></fieldset>
 <fieldset><legend>Team debrief</legend><ol class="debrief"><li>Which decision made you the most money? Find it in the results table.</li><li>Was your funding choice right? Work out what you’d have ended with under a different option.</li><li>Which prediction missed by the most, and what did you overlook?</li><li>Would you make the same crisis call if the outcome were public?</li></ol></fieldset>
 <textarea id="logtext" hidden readonly>${esc(text)}</textarea>`;
}
/* ---------- halftime report (after Round 3) ---------- */
const R4_DEFAULT={customer:'utilities',tier:'mid',pace:'steady',safety:'yes',protect:'yes',research:'no'};
function projectR4(s3){ const c=JSON.parse(JSON.stringify(s3)); try{ return p3Play(c,{...R4_DEFAULT}).profit; }catch(e){ return 0; } }
function replayChecked(team,decs){ const s=p3New(team); let blocked=false; for(const d0 of decs){ const d={...d0,predict:undefined}; const up=p3Upfront(s,d); if(up>0&&up>s.cash+1e-9) blocked=true; try{ p3Play(s,d); }catch(e){ return {s,blocked:true}; } } return {s,blocked}; }
const outlook=s3=>{ const f=P.funding[s3.funding], v=s3.cash+3*projectR4(s3)-f.repay; return v>0?v*(1-f.share):v; };
let BEST_SETUP=null;
function bestSetup(){ if(BEST_SETUP!==null) return BEST_SETUP; const r=replayChecked('Reference',[{site:'ridge',survey:'yes',interviews:'no',pledge:'no'},{funding:'loan',transport:'truck',marketing:'no',rnd:'yes'},{rigs:'full',extend:'no',insurance:'no',safety:'yes',protect:'yes'}]); return BEST_SETUP=projectR4(r.s); }
function halftime(s){
 const decs=game.decisions.slice(0,3), H=s.history, c1=decs[0], c2=decs[1], c3=decs[2], site=P.sites[s.site];
 const proj=projectR4(s), base=outlook(s);
 const good=[], bad=[], tips=[];
 // Biggest missed opportunities: change one decision from Rounds 1-3, same luck.
 const misses=[];
 for(let R=1;R<=3;R++) for(const d of DECISIONS[R]){ const stAt=replay(game.team,decs.slice(0,R-1)); for(const o of decisionOptions(stAt,R,d.key)){ if(o.v===decs[R-1][d.key]) continue; if(d.info&&o.v==='no') continue;
  const alt=decs.map(x=>({...x})); alt[R-1][d.key]=o.v; if(d.key==='site'&&o.v==='ridge') alt.forEach((x,i)=>{ if(i>=2) x.protect='yes'; });
  const r=replayChecked(game.team,alt); if(r.blocked) continue; const gain=outlook(r.s)-base; if(gain>=0.5) misses.push({owner:d.owner,title:d.title,label:o.label,gain}); } }
 misses.sort((a,b)=>b.gain-a.gain);
 const incidentCost=H.reduce((a,h)=>a+h.penalties,0);
 if(yes(c1.survey)) good.push(`<b>Operations bought the survey.</b> The team knew what was underground before committing ${m(site.license)}.`);
 else if(s.site==='coast') bad.push(`<b>No survey on Coastal Shelf.</b> It holds ${site.actual}k barrels a round, not the advertised ${site.advertised}k. A $0.5M survey would have shown that.`);
 if(yes(c1.interviews)) good.push('<b>Sales interviewed customers.</b> You already know exactly how much each customer buys, so Round 4 needs no research.');
 if(s.site==='ridge') good.push('<b>The Explorer picked the biggest site.</b> Northern Ridge has the most earning power in the game.');
 if(s.rigs==='starter') bad.push('<b>Your field runs at half capacity.</b> Starter rigs pump half of what the site allows, every round.');
 else good.push(`<b>Full rigs.</b> You’re pumping everything ${site.name} allows.`);
 if(c2.transport==='pipeline') (site.actual*P.rigs[s.rigs].output>=200?good:bad).push(site.actual*P.rigs[s.rigs].output>=200?'<b>The pipeline fits your volume.</b> Saving $4 a barrel on this much fuel pays back the $3M.':'<b>The pipeline may not pay back.</b> At your volume, the $4-a-barrel saving takes a long time to cover $3M.');
 if(yes(c2.rnd)) good.push('<b>The geology partnership</b> cuts your pumping cost $4 a barrel from Round 4.');
 if(yes(c3.extend)) good.push('<b>Field extended.</b> Output rises 15% from Round 4.');
 if(c2.funding==='investor') bad.push('<b>Gave up 30% of the company.</b> Every $1M you earn from here is worth $0.7M to the founders.');
 if(incidentCost>0) bad.push(`<b>Accidents and fines have cost ${m(incidentCost)}</b>, and the $3M clean-record bonus is gone.`);
 else if(!yes(c3.safety)||(site.risky&&!yes(c3.protect))) bad.push(`<b>You skipped ${!yes(c3.safety)?'safety':'wetland protection'} and got lucky.</b> That’s a ${!yes(c3.safety)?'35%':s.pledge?'20%':'50%'} chance of a $4M hit every round.`);
 else good.push('<b>Clean record so far.</b> The $3M clean-record bonus is still in reach.');
 if(typeof c3.predict==='number'){ const err=Math.abs(c3.predict-H[2].profit); (err<=P.predictBand?good:bad).push(err<=P.predictBand?`<b>Finance’s prediction was accurate</b>, within ${m(err)}.`:`<b>Finance’s prediction missed by ${m(err)}.</b> Predicted ${m(c3.predict)}, actual ${m(H[2].profit)}.`); }
 const rating=proj>=11&&incidentCost===0?['top','On track for a top finish']:proj>=6?['mid','Solid, with room to grow']:['low','Behind: time to adjust'];
 const out=site.actual*P.rigs[s.rigs].output*(s.extend?1+P.extendBoost:1), perBbl=site.cost-(s.rnd?P.rndCut:0)+P.transport[s.transport].perBbl;
 tips.push(out<=P.customers.airlines.cap?`<b>Sales – Round 4:</b> your ${Math.round(out)}k barrels fit under the airlines’ 150k cap, and airlines pay $15 more. ${s.interviews?'Check your interview results':'Research shows how much they’ll take'} before choosing.`:`<b>Sales – Round 4:</b> airlines take at most 150k barrels, and you’ll pump about ${Math.round(out)}k. Anything left over goes to traders at $60. ${s.interviews?'Your interview results':'Research'} show how much each customer buys.`);
 tips.push(`<b>Finance – predictions:</b> profit = barrels sold × price − ${Math.round(out)}k barrels × $${perBbl} (pumping + transport) − running costs ($1M overhead + $1M safety${site.risky?' + $1M protection':''}${s.insurance?' + $0.5M insurance':''}).`);
 tips.push(`<b>Operations – pace:</b> pushing the field adds 20% output but +$3 a barrel and +10% accident risk every round${s.insurance?'. Your insurance covers 75% of an accident':''}.`);
 if(!yes(c3.safety)||(site.risky&&!yes(c3.protect))) tips.push(`<b>Turn ${!yes(c3.safety)?'safety':'wetland protection'} back on.</b> $1M a round is cheaper than the expected cost of a $4M hit, and it protects the $3M bonus.`);
 tips.push(`<b>CEO and Sales – Round 5:</b> the cheapest crisis response usually carries a risk${s.pledge?' (your pledge lowers it)':''}. Sales can spend $0.5M to stop a crisis from costing you customer orders.`);
 tips.push(`<b>Everyone – Round 6:</b> a buyer will offer $8M. You’re on pace for about ${m(proj)} profit a round before the competitor’s price cut. If the CEO sells, money Operations and Sales spend that round is wasted, so decide together.`);
 if(c2.funding==='loan') tips.push('<b>Finance – the loan:</b> repaying early in Round 5 costs $7M instead of $8M at the end, if you can spare the cash.');
 return {rating,proj,best:bestSetup(),good,bad,tips,misses:misses.slice(0,2)};
}
function halfKey(){ return 'fiteen-half:'+slug(game.team)+':'+JSON.stringify(game.decisions.slice(0,3).map(d=>[d.site,d.funding,d.rigs])); }
function showHalftime(){
 if(!st||st.history.length<3) return;
 const s3=replay(game.team,game.decisions.slice(0,3)), r=halftime(s3);
 const back=document.createElement('div'); back.className='modal-back'; back.id='halftime';
 back.innerHTML=`<div class="modal" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="htTitle">
  <div><h3>Halftime report · after Round 3 of 6</h3><h2 id="htTitle">How ${esc(st.team)} is doing</h2></div>
  <div class="grade"><span class="pill ${r.rating[0]}">${r.rating[1]}</span>
   <div class="kpi"><span>Cash after Round 3</span><strong>${m(s3.cash)}</strong></div>
   <div class="kpi"><span>Projected profit per round</span><strong>${m(r.proj)}</strong></div>
   <div class="kpi"><span>A strong setup</span><strong>${m(r.best)}</strong></div></div>
  <p class="note" style="margin:0">Projection assumes selling to power utilities at Market price, steady pace, safety on. The strong setup is Northern Ridge with a loan, full rigs and the research partnership. Cash is low for most teams right now because rigs are a big up-front purchase. Profit rises from Round 4, when customers pay more than traders.</p>
  ${r.good.length?`<div><h3>What went well</h3><ul class="fb good">${r.good.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
  ${r.bad.length?`<div><h3>What hurt you</h3><ul class="fb bad">${r.bad.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
  ${r.misses.length?`<div><h3>Biggest missed opportunities so far</h3><ul class="fb bad">${r.misses.map(x=>`<li><b>${x.owner}: ${x.title.replace(/\?$/,'')} \u2192 ${x.label}</b> would be worth about ${m(x.gain)} more by the end of the game, with everything else the same. Too late to change, but worth discussing.</li>`).join('')}</ul></div>`:''}
  <div><h3>Where to improve in Rounds 4–6</h3><ul class="fb tip">${r.tips.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  <p class="note" style="margin:0">Talk this through as a team for two minutes before starting Round 4.</p>
  <div class="row"><button class="go" id="htClose">Start Round 4</button></div></div>`;
 document.body.appendChild(back);
 const close=()=>{ back.remove(); document.removeEventListener('keydown',esc_); const b=$('#htOpen'); if(b) b.focus(); };
 const esc_=e=>{ if(e.key==='Escape') close(); };
 document.addEventListener('keydown',esc_);
 back.addEventListener('click',e=>{ if(e.target===back) close(); });
 $('#htClose').onclick=close; back.querySelector('.modal').focus({preventScroll:true}); back.scrollTop=0;
 if(st.done) $('#htClose').textContent='Close';
 else if(st.round>4) $('#htClose').textContent='Back to the game';
 try{ localStorage.setItem(halfKey(),'1'); }catch(e){}
}
function maybeHalftime(){
 if(mode!=='game'||!st||st.history.length!==3||st.done||$('#halftime')) return;
 let seen=false; try{ seen=localStorage.getItem(halfKey())==='1'; }catch(e){}
 if(!seen) showHalftime();
}
function bannerHtml(){
 if(live&&canWrite) return `<div class="banner live"><span class="dot"></span><span><b>Live.</b> Everyone who joins “${esc(game.team)}” sees every choice and result as it happens. Agree before you click Run.</span></div>`;
 if(live) return `<div class="banner watch"><span class="dot"></span><span><b>Watching live.</b> You see this team’s choices as they happen. Only people the owner invited as editors can make choices.</span></div>`;
 return `<div class="banner"><span class="dot"></span><span><b>This device only.</b> Live team play isn’t available here, so teammates won’t see your choices.</span></div>`;
}
function renderRolesScreen(){
 app.innerHTML=`<div class="start" style="max-width:760px">
 <h1><small>${esc(game.team)} · before you start</small>Pick your role</h1>
 <p>Each round is led by one role, and only that role’s leader can press Run. Everyone can still pick options and type during any round.</p>
 <p class="note">Teams of 5: one role each. Fewer than 5: some people take two roles. More than 5: up to two people can share a role.</p>
 <label for="myname" style="flex-direction:column;align-items:flex-start;gap:4px"><h3 style="margin:0">Your name</h3><input id="myname" class="textin" maxlength="40" value="${esc(me.name)}" placeholder="First name"></label>
 <fieldset><legend>Your role (pick 1 or 2)</legend><div class="rolegrid" id="rolegrid"></div></fieldset>
 <p class="warn" id="rolewarn"></p>
 <div class="row"><button class="go" id="rolego">Continue to the game</button>${game.roster&&game.roster[myId]?'<button class="alt" id="rolecancel">Cancel</button>':''}<button class="alt" id="roleleave">Switch team</button></div></div>`;
 renderRoleCards();
 $('#myname').addEventListener('input',()=>{ me.name=$('#myname').value; roleCheck(); });
 $('#rolego').onclick=saveRoles; $('#roleleave').onclick=leaveGame;
 if($('#rolecancel')) $('#rolecancel').onclick=()=>{ const mine=game.roster[myId]; if(mine) me={name:mine.name,roles:[...mine.roles]}; mode='game'; render(); };
}
function renderRoleCards(){
 const el=$('#rolegrid'); if(!el) return;
 const others={...game.roster}; delete others[myId];
 el.innerHTML=ROLES.map(([r,desc])=>{ const h=holders(r,others), mine=me.roles.includes(r), full=h.length>=MAX_PER_ROLE, capped=!mine&&me.roles.length>=MAX_ROLES;
  return `<label class="rolecard"><input type="checkbox" value="${r}" ${mine?'checked':''} ${(!mine&&(full||capped))?'disabled':''}><b>${r}</b><span class="why">${desc}</span><span class="who">${h.length?'Taken by '+h.map(([k,v])=>esc(v.name)).join(' & '):'Open'}${full&&!mine?' · full':''}</span></label>`; }).join('');
 el.querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{ me.roles=i.checked?[...new Set([...me.roles,i.value])]:me.roles.filter(x=>x!==i.value); renderRoleCards(); }));
 roleCheck();
}
function roleCheck(){
 const w=$('#rolewarn'), b=$('#rolego'); if(!w||!b) return;
 const msg=!me.name.trim()?'Enter your name.':!me.roles.length?'Pick at least one role.':'';
 w.textContent=msg; b.disabled=!!msg;
}
async function saveRoles(){
 me.name=me.name.trim().slice(0,40); try{ localStorage.setItem('novium-name',me.name); }catch(e){}
 const entry={name:me.name,roles:ROLE_KEYS.filter(r=>me.roles.includes(r))};
 game.roster={...game.roster,[myId]:entry};
 if(live&&dbRef&&canWrite){ $('#rolego').disabled=true; try{ await enqueue(()=>dbRef.update({roster:{[myId]:entry}})); }catch(e){ $('#rolego').disabled=false; $('#rolewarn').textContent='Your role didn’t save. Check your connection and try again.'; return; } }
 mode='game'; render();
}
function rosterHtml(){
 if(st.done) return '';
 const R=st.round, lead=leadOf(R), roster=game.roster||{};
 return ROLE_KEYS.map(r=>{ const h=holders(r,roster); return `<span class="${r===lead?'lead':''}">${r}${r===lead?' (leads now)':''}: ${h.length?h.map(([k,v])=>esc(v.name)+(k===myId?' (you)':'')).join(' & '):'<span class="open">open</span>'}</span>`; }).join('');
}
function renderRoster(){ const el=$('#roster'); if(el) el.innerHTML=rosterHtml(); }
function runBlock(){
 if(!canWrite) return 'Watching only.';
 if(!live) return '';
 const lead=leadOf(st.round);
 if(!holders(lead,game.roster||{}).length) return `No one has the ${lead} role yet. Pick it under “Change my role” to run this round.`;
 if(!me.roles.includes(lead)) return `Only the ${lead} can run this round. You can still pick options and type.`;
 return '';
}
function render(){
 if(mode==='lobby') return renderLobby();
 if(mode==='roles') return renderRolesScreen();
 const R=st.round;
 app.innerHTML=`<header><h1><small>${esc(st.team)}</small>Fiteen Frontier</h1><div class="row">${canWrite?'<button class="alt" id="myrole">Change my role</button>':''}${st.history.length>=3?'<button class="alt" id="htOpen">Halftime report</button>':''}<button class="alt" id="leave">Switch team</button>${canWrite?`<button class="alt" id="reset">${confirmReset?'Click again to erase this game':'Start over'}</button>`:''}</div></header>
 ${bannerHtml()}
 <div class="roster" id="roster">${rosterHtml()}</div>
 <div class="track" style="grid-template-columns:repeat(6,1fr)">${ROUNDS.map((r,i)=>`<div class="step ${i+1<R||st.done?'done':i+1===R?'now':''}"><b>R${i+1}</b>${r[0]}</div>`).join('')}</div>
 <div class="kpis">${[['Cash',m(st.cash)],['Site',st.site?P.sites[st.site].name:'—'],['Funding',st.round>2?P.funding[st.funding].name:'—'],['Accidents & fines',st.incidents]].map(([a,b])=>`<div class="kpi"><span>${a}</span><strong>${b}</strong></div>`).join('')}</div>
 <div class="grid"><section class="sheet">${st.done?endView():decisionView()}</section><aside class="ledger">${ledger()}${logView()}</aside></div>`;
 $('#leave').onclick=leaveGame;
 if($('#htOpen')) $('#htOpen').onclick=showHalftime;
 setTimeout(maybeHalftime,0);
 if($('#myrole')) $('#myrole').onclick=()=>{ mode='roles'; render(); };
 if($('#reset')) $('#reset').onclick=resetGame;
 if(st.done){
  $('#copy').onclick=()=>{const t=$('#logtext').value;navigator.clipboard.writeText(t).then(()=>$('#cp').textContent='Copied.',()=>{const a=$('#logtext');a.hidden=false;a.select();$('#cp').textContent='Select all and copy the text above.'})};
  return;
 }
 applyDraft(game.draft);
 const sheet=$('.sheet');
 if(!canWrite){ sheet.querySelectorAll('input,select,textarea,button').forEach(el=>el.disabled=true); check(); return; }
 sheet.addEventListener('input',onEdit); sheet.addEventListener('change',onEdit);
 if($('#research')) $('#research').onclick=()=>{ game.draft={...readDraft(),research:true}; rebuild(); render(); queueDraftSave(true); };
 $('#run').onclick=runRound;
 check();
}
function onEdit(e){
 if(e.target.id==='crisisCard'){ if(e.type!=='change') return; game.draft={...readDraft(),crisisCard:e.target.value}; rebuild(); render(); queueDraftSave(true); return; }
 game.draft=readDraft(); check(); queueDraftSave(false);
}
async function runRound(){
 const d=readD(); const decisions=[...game.decisions,d];
 $('#run').disabled=true;
 if(live&&dbRef){
  clearTimeout(saveTimer); saveTimer=null;
  try{ await enqueue(()=>dbRef.update({decisions,draft:null,updatedAt:Date.now()})); }
  catch(e){ dirtyLocal=false; writeFailed(e); check(); return; }
  dirtyLocal=false;
 }
 game={...game,decisions,draft:{}}; rebuild(); render(); window.scrollTo({top:0});
}
async function resetGame(){
 if(!confirmReset){ confirmReset=true; render(); setTimeout(()=>{ if(confirmReset){ confirmReset=false; if(mode==='game') render(); } },4000); return; }
 confirmReset=false;
 if(live&&dbRef){ clearTimeout(saveTimer); saveTimer=null; try{ await enqueue(()=>dbRef.update({decisions:[],draft:null,updatedAt:Date.now()})); }catch(e){ writeFailed(e); return; } dirtyLocal=false; }
 game={...game,decisions:[],draft:{}}; rebuild(); render();
}
render();
init();
</script>
